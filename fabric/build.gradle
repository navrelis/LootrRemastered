plugins {
    id 'fabric-loom' version "1.14.7"
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "ParchmentMC"
                url = "https://maven.parchmentmc.org"
            }
        }
        filter {
            includeGroupAndSubgroups("org.parchmentmc")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.terraformersmc.com/releases"
            }
        }
        filter {
            includeGroupAndSubgroups("com.terraformersmc")
        }
    }
}


sourceSets {
    // In-game tests (Fabric Game Test API). Not part of the release jar; they run only through :fabric:runGametest.
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(loom.layered {
        it.officialMojangMappings()
        it.parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    })
    compileOnly(project.project(":common")) {
        transitive = false
    }

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // COMPAT
    modCompileOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        transitive = false
    }
    modLocalRuntime("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        transitive = false
    }

    modImplementation "maven.modrinth:jade:${project.jade_version}+fabric"

    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config}")
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config}")
    modCompileOnly "dev.thomasglasser.sherdsapi:sherdsapi-fabric-${minecraft_version}:${sherdsapi_version}"

    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixin_extras_version}"))
    implementation("io.github.llamalad7:mixinextras-fabric:${rootProject.mixin_extras_version}")
}

loom {
    mods {
        "${mod_id}" {
            // Tell Loom about each source set used by your mod here. This ensures that your mod's classes are properly transformed by Loader.
            sourceSet sourceSets.main
            sourceSet project.project(":common").sourceSets.main
        }
        "lootr_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    def awFile = project.file("src/main/resources/${mod_id}.accesswidener")
    if (awFile.exists()) {
        accessWidenerPath.set(awFile)
    }

    mixin {
        useLegacyMixinAp = false
    }

    runs {
        configureEach {
            runDir("run")
            ideConfigGenerated(true)
        }

        client {
            client()
            setConfigName("Fabric Client")

            if (project.hasProperty('mc_uuid')) {
                programArg("--uuid=${project.findProperty('mc_uuid')}")
            }

            if (project.hasProperty('mc_username')) {
                programArg("--username=${project.findProperty('mc_username')}")
            }

            if (project.hasProperty('mc_java_agent_path')) {
                vmArg("-javaagent:${project.findProperty('mc_java_agent_path')}")
            }
        }

        server {
            server()
            setConfigName("Fabric Server")
        }

        gametest {
            server()
            setConfigName("Fabric Game Test")
            source sourceSets.gametest
            runDir("build/gametest/run")
            ideConfigGenerated(false)

            vmArg("-Dfabric-api.gametest")
            vmArg("-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest/junit.xml")
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    source(project.project(":common").sourceSets.main.allJava)
}

tasks.named("javadoc", Javadoc).configure {
    source(project.project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project.project(":common").sourceSets.main.allSource)
}

processResources {
    // The access transformer is only used to compile :common against vanilla; Fabric uses the access widener.
    exclude("META-INF/accesstransformer.cfg")

    from project.project(":common").sourceSets.main.resources

    from("../datapacks") {
        into("datapacks")
        include("lootr_no_advancements/**")
        include("lootr_no_suspicious_blocks/**")
        exclude("**/.cache/**")
    }
}

tasks.named("processGametestResources", ProcessResources) {
    filteringCharset = "UTF-8"
    def gametestProps = ["version": project.version]
    inputs.properties(gametestProps)
    filesMatching("fabric.mod.json") {
        expand gametestProps
    }
}

// Ship the code and asset licences at the jar root; remapJar remaps the output of this task, so they end up in the release jar.
tasks.named("jar", Jar) {
    from(rootProject.file("LICENSE"))
    from(rootProject.file("LICENSE_ASSETS.txt"))
}

tasks.build.mustRunAfter tasks.clean
