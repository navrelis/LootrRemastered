# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata, the Minecraft version and the library versions: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.17.0
# Minimum fabricloader declared in fabric.mod.json's "depends".
fabric_loader_version_min=0.17.0
fabric_api_version=0.116.7+1.21.1

# Compat dependencies that only exist for Fabric
mod_menu_version=11.0.3
