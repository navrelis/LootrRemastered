# Values shared by every loader build of this branch (fabric/, neoforge/, forge/). Each loader's settings.gradle loads
# this file and exposes the values as project properties, so they are defined exactly once. Loader-specific versions
# live in <loader>/gradle.properties.

# Mod metadata
# The unique mod identifier.
mod_id=lootr
mod_name=Lootr Remastered
mod_version=2.1.0
# Maven group; matches the base package of the sources.
mod_group=noobanidus.mods.lootr
mod_license=MIT
mod_authors=navrelis
mod_description=Per-player loot containers with built-in structure loot integration.
sources_url=https://github.com/navrelis/LootrRemastered
issues_url=https://github.com/navrelis/LootrRemastered/issues
license_url=https://github.com/navrelis/LootrRemastered/blob/HEAD/LICENSE
homepage_url=https://github.com/navrelis/LootrRemastered

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
java_version=21
# The JDK CI uses to RUN Gradle itself (independent of the compile toolchain, which foojay auto-provisions via
# settings.gradle). Read by .github/workflows/build.yml.
ci_gradle_jdk=21

# Mappings: Mojang names layered with Parchment parameter names and docs
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Libraries and compat dependencies used by every loader build
mixin_extras_version=0.5.0
jetbrains_annotations_version=26.0.1
auto_service_version=1.0.1
jade_version=15.10.0
sherdsapi_version=6.0.1
cloth_config=15.0.127
