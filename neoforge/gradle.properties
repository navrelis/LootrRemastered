# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata, the Minecraft version and the library versions: ../gradle/shared.properties

# NeoForge toolchain
# The NeoForge version this build compiles and runs against: https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.219
# Minimum NeoForge declared in neoforge.mods.toml's "neoforge" dependency.
neoforge_version_range_min=21.1.195
# The loader version range can only use the major version of FML as bounds.
neoforge_loader_version_range=[2,)
