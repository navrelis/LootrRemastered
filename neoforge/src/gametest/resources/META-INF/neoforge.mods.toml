side="BOTH"

[[dependencies.${mod_id}_gametest]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version_range_min},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}_gametest]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
