modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}_gametest"
version="${version}"
displayName="Lootr Remastered Game Tests"
description='''In-game tests for Lootr Remastered. Development only; not part of the release.'''

[[mixins]]
config="lootr_gametest.mixins.json"

[[dependencies.${mod_id}_gametest]]
modId="${mod_id}"
type="required"
versionRange="*"
